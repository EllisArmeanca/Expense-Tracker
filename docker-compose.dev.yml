version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: expense_tracker_postgres_dev
    environment:
      POSTGRES_DB: ${POSTGRES_DB_DEV:-expense_tracker_dev}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - ./backend/.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: expense_tracker_backend_dev
    ports:
      - "${BACKEND_PORT:-4000}:${BACKEND_PORT:-4000}"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    environment:
      DATABASE_URL: ${DATABASE_URL_DEV:-postgresql://postgres:postgres@postgres:5432/expense_tracker_dev}
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-here}
      NODE_ENV: development
      PORT: ${BACKEND_PORT:-4000}
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
    stdin_open: true
    tty: true
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: expense_tracker_frontend_dev
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:4000}
      NODE_ENV: development
    env_file:
      - ./frontend/.env
    depends_on:
      - backend
    stdin_open: true
    tty: true
    restart: unless-stopped

volumes:
  postgres_data:
  backend_node_modules:
  frontend_node_modules: